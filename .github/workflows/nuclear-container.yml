name: Build and Push Nuclear Images

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
        env:
          # Use the executable directly, without the distribution's shell launcher.
          CHROME_BIN: /opt/google/chrome/chrome
      - run: npm run test:browser:companion
        env:
          CHROME_BIN: /opt/google/chrome/chrome
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            /tmp/nuclear-power-check-*/*.png
            /tmp/nuclear-power-check-*/*.json
            /tmp/nuclear-companion-check-*/*.png
          if-no-files-found: ignore
          retention-days: 1

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The backend installs dependencies inside each target architecture.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/norkator/nuclear:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push session backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.sessions
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/norkator/nuclear-backend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
