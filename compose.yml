services:
  web:
    image: ghcr.io/norkator/nuclear:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NUCLEAR_PORT:-8080}:80"
    depends_on:
      session-server:
        condition: service_healthy
    restart: unless-stopped
  session-server:
    image: ghcr.io/norkator/nuclear-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.sessions
    environment:
      ALLOWED_ORIGINS: "${NUCLEAR_ALLOWED_ORIGINS:-}"
    expose:
      - "8081"
    init: true
    restart: unless-stopped
